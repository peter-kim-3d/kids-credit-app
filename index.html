<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Credit Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Kids Credit Tracker 🌟</h1>
            <div class="balance-display">
                <div class="balance-label">Credit Balance</div>
                <div class="balance-value" id="balance">0:00</div>
                <div class="balance-sublabel">(hours:minutes)</div>
            </div>
        </header>

        <div class="main-content">
            <!-- Earn Credits Section -->
            <section class="earn-section">
                <h2>💪 Earn Credits</h2>
                <div class="activity-cards">
                    <div class="activity-card earn">
                        <h3>📚 Study</h3>
                        <div class="timer-display" id="study-timer">00:00</div>
                        <div class="button-group">
                            <button class="btn btn-start" onclick="startTimer('study')">Start</button>
                            <button class="btn btn-stop" onclick="stopTimer('study')">Stop</button>
                        </div>
                    </div>
                    <div class="activity-card earn">
                        <h3>🎵 Practice</h3>
                        <div class="timer-display" id="practice-timer">00:00</div>
                        <div class="button-group">
                            <button class="btn btn-start" onclick="startTimer('practice')">Start</button>
                            <button class="btn btn-stop" onclick="stopTimer('practice')">Stop</button>
                        </div>
                    </div>
                    <div class="activity-card earn">
                        <h3>🧹 Cleaning</h3>
                        <div class="timer-display" id="cleaning-timer">00:00</div>
                        <div class="button-group">
                            <button class="btn btn-start" onclick="startTimer('cleaning')">Start</button>
                            <button class="btn btn-stop" onclick="stopTimer('cleaning')">Stop</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Spend Credits Section -->
            <section class="spend-section">
                <h2>🎮 Spend Credits</h2>
                <div class="activity-cards">
                    <div class="activity-card spend">
                        <h3>📺 TV/Tablet</h3>
                        <div class="timer-display" id="tv-timer">00:00</div>
                        <div class="button-group">
                            <button class="btn btn-start" onclick="startTimer('tv')">Start</button>
                            <button class="btn btn-stop" onclick="stopTimer('tv')">Stop</button>
                        </div>
                    </div>
                    <div class="activity-card spend">
                        <h3>🎮 Game</h3>
                        <div class="timer-display" id="game-timer">00:00</div>
                        <div class="button-group">
                            <button class="btn btn-start" onclick="startTimer('game')">Start</button>
                            <button class="btn btn-stop" onclick="stopTimer('game')">Stop</button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- History Section -->
            <section class="history-section">
                <div class="history-header">
                    <h2>📋 Activity History</h2>
                    <button class="btn btn-clear" onclick="clearHistory()">Clear History</button>
                </div>
                <div class="history-list" id="history-list">
                    <p class="no-history">No activities yet. Start earning credits!</p>
                </div>
            </section>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
